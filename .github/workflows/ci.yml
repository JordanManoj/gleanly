name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra pdf --extra ocr
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  audit:
    # Known vulnerabilities in the locked runtime dependencies (all extras).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv export --frozen --no-hashes --no-dev --all-extras --no-emit-project -o audit-requirements.txt
      - run: uvx pip-audit -r audit-requirements.txt

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Tesseract (OCR tests; skipped where it is missing)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: uv sync --locked --extra pdf --extra ocr
      - name: Download the glyphly OCR models (tests never download)
        run: uv run glyphly download --all
      - run: uv run pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/gleanly --version
          /tmp/smoke/bin/gleanly load tests/fixtures/article.html -o /tmp/smoke.md
          test -s /tmp/smoke.md
      - name: Smoke-test with pre-release dependencies allowed (what `pip install --pre` does)
        run: |
          uv venv /tmp/smoke-pre
          uv pip install --python /tmp/smoke-pre --prerelease allow dist/*.whl
          /tmp/smoke-pre/bin/gleanly load tests/fixtures/article.html -o /tmp/smoke-pre.md
          test -s /tmp/smoke-pre.md
