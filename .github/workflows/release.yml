name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Tesseract (so the OCR tests run, not skip)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: uv sync --locked --extra pdf --extra ocr
      - run: uv run pytest
      - name: Check the tag matches the package version
        run: |
          version=$(uv run python -c "import gleanly; print(gleanly.__version__)")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - run: uv build
      - name: Smoke-test the wheel as a new user would install it
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/gleanly load tests/fixtures/article.html -o /tmp/smoke.md
          test -s /tmp/smoke.md
          uv venv /tmp/smoke-pre
          uv pip install --python /tmp/smoke-pre --prerelease allow dist/*.whl
          /tmp/smoke-pre/bin/gleanly load tests/fixtures/article.html -o /tmp/smoke-pre.md
          test -s /tmp/smoke-pre.md
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing, no API token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
