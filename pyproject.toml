[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "gleanly"
dynamic = ["version"]
description = "All-in-one text acquisition for AI: scraping, OCR and search with trust scores, compliance metadata and provenance."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jordan Manoj" }]
keywords = ["scraping", "markdown", "rag", "llm", "ocr", "search", "provenance", "compliance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
# Core stays light. Every dependency's license is recorded in docs/dependencies.md.
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "lxml>=5.2,<7",
    "protego>=0.3,<1",
]

[project.optional-dependencies]
# Rung 3 of the fetch ladder. After installing run: playwright install chromium
browser = ["playwright>=1.45,<2"]
# Native PDFs: text layer with page + bounding-box provenance.
pdf = ["pypdfium2>=4.30,<6"]
# OCR for images and scanned PDFs with glyphly (pip only, no system program).
# Tesseract (https://github.com/tesseract-ocr/tesseract) still works when installed:
# ocr_engine="tesseract".
ocr = ["glyphly>=0.1.0a1,<0.2", "pypdfium2>=4.30,<6", "pillow>=10.0,<14"]
# search and llm extras arrive with their phases (see docs/roadmap.md).

[project.scripts]
gleanly = "gleanly.cli:main"

[project.urls]
Homepage = "https://github.com/JordanManoj/gleanly"
Source = "https://github.com/JordanManoj/gleanly"
Issues = "https://github.com/JordanManoj/gleanly/issues"
Changelog = "https://github.com/JordanManoj/gleanly/blob/main/CHANGELOG.md"
Benchmarks = "https://github.com/JordanManoj/gleanly/blob/main/bench/README.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "pyright>=1.1.380",
]
# Baseline extractors for bench/ only. Never shipped with the package.
bench = [
    "trafilatura>=2.0",
    "readability-lxml>=0.8",
    "rapidocr>=3.0",
    "onnxruntime>=1.18",
]

[tool.hatch.version]
path = "src/gleanly/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gleanly"]

# Source distribution: an allow-list, so nothing else in the working folder can be shipped.
[tool.hatch.build.targets.sdist]
include = [
    "src/gleanly",
    "tests",
    "bench/*.py",
    "bench/README.md",
    "docs",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT"]

[tool.ruff.lint.per-file-ignores]
# Real text in many scripts: long lines, letters that look like Latin ones.
"tests/test_languages.py" = ["E501", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["gleanly", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
